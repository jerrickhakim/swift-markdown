<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="{{policy}}">
<style>
:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;padding:8px;font:15px -apple-system,sans-serif;color:CanvasText;background:Canvas}img,svg,canvas{max-width:100%}button,input,select,textarea{font:inherit}button{cursor:pointer}pre{overflow:auto}.text-muted{opacity:.65}.text-small{font-size:12px}.viz-row,.viz-controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.viz-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}.card{padding:16px;border:1px solid GrayText;border-radius:12px}.btn{padding:6px 12px;border:1px solid GrayText;border-radius:6px;background:ButtonFace;color:ButtonText}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
</style></head><body><main id="preview-content">{{fragment}}</main>
<script>
(()=>{
const content=document.getElementById('preview-content');
let pending=false;
const report=()=>{if(pending)return;pending=true;requestAnimationFrame(()=>{pending=false;parent.postMessage({previewHeight:Math.ceil(content.getBoundingClientRect().height)+16},'*')})};
new ResizeObserver(report).observe(content);window.addEventListener('load',report);report();
})();
</script></body></html>
